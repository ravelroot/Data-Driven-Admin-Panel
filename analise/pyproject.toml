[project]
name = "bento-analise"
version = "1.6.0"
description = "Motor analítico do Bento: previsões, risco de cancelamento, segmentação, coortes, simulador, qualidade de dados e relatórios em Excel"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
