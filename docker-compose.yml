name: bento

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BENTO_DB_NOME:-bento}
      POSTGRES_USER: ${BENTO_DB_USUARIO:-bento}
      POSTGRES_PASSWORD: ${BENTO_DB_SENHA:?Defina BENTO_DB_SENHA no arquivo .env}
    volumes:
      - dados-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  analise:
    build: ./analise
    restart: unless-stopped
    environment:
      BENTO_ANALISE_TOKEN: ${BENTO_ANALISE_TOKEN:-}
      BENTO_ANALISE_LIMITE_MB: ${BENTO_ANALISE_LIMITE_MB:-96}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BENTO_ANALISE_MEMORIA:-2g}
    cpus: ${BENTO_ANALISE_CPUS:-2}
    pids_limit: 128
    expose:
      - "8090"

  bento:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      analise:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${BENTO_DB_USUARIO:-bento}:${BENTO_DB_SENHA}@postgres:5432/${BENTO_DB_NOME:-bento}
      BENTO_SEGREDO_JWT: ${BENTO_SEGREDO_JWT:?Defina BENTO_SEGREDO_JWT no arquivo .env}
      BENTO_HTTPS: ${BENTO_HTTPS:-false}
      BENTO_ORIGENS: ${BENTO_ORIGENS:-}
      BENTO_PROXY: ${BENTO_PROXY:-false}
      BENTO_SEMEAR: ${BENTO_SEMEAR:-auto}
      BENTO_SIMULADOR: ${BENTO_SIMULADOR:-true}
      BENTO_SIMULADOR_INTERVALO: ${BENTO_SIMULADOR_INTERVALO:-25}
      BENTO_FUSO: ${BENTO_FUSO:-America/Sao_Paulo}
      BENTO_LOG: ${BENTO_LOG:-info}
      BENTO_POOL: ${BENTO_POOL:-10}
      BENTO_ADMIN_EMAIL: ${BENTO_ADMIN_EMAIL:-}
      BENTO_ADMIN_SENHA: ${BENTO_ADMIN_SENHA:-}
      BENTO_ADMIN_NOME: ${BENTO_ADMIN_NOME:-}
      BENTO_INTEGRACOES_REDE_INTERNA: ${BENTO_INTEGRACOES_REDE_INTERNA:-}
      BENTO_BACKUP_AUTOMATICO: ${BENTO_BACKUP_AUTOMATICO:-diario}
      BENTO_BACKUP_MANTER: ${BENTO_BACKUP_MANTER:-7}
      BENTO_RETENCAO_NOTIFICACOES: ${BENTO_RETENCAO_NOTIFICACOES:-180}
      BENTO_RETENCAO_RELATORIOS: ${BENTO_RETENCAO_RELATORIOS:-90}
      BENTO_RETENCAO_AUDITORIA: ${BENTO_RETENCAO_AUDITORIA:-0}
      BENTO_RETENCAO_SESSOES: ${BENTO_RETENCAO_SESSOES:-30}
      BENTO_RETENCAO_ENTREGAS: ${BENTO_RETENCAO_ENTREGAS:-30}
      BENTO_RETENCAO_ALERTAS: ${BENTO_RETENCAO_ALERTAS:-180}
      BENTO_METRICAS_TOKEN: ${BENTO_METRICAS_TOKEN:-}
      BENTO_ANALISE_URL: ${BENTO_ANALISE_URL:-http://analise:8090}
      BENTO_ANALISE_TOKEN: ${BENTO_ANALISE_TOKEN:-}
      BENTO_ANALISE_TIMEOUT: ${BENTO_ANALISE_TIMEOUT:-60}
      BENTO_ANALISE_CACHE: ${BENTO_ANALISE_CACHE:-10}
    volumes:
      - dados-bento:/app/dados
    ports:
      - "${BENTO_PORTA:-8080}:8080"
    stop_grace_period: 20s

volumes:
  dados-postgres:
  dados-bento:
