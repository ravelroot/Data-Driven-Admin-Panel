name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/atividade.txt"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    name: Interface (TypeScript + Tailwind CSS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Conferir a versão em todos os arquivos
        run: npm run versao -- --conferir
      - name: Checar tipos da interface
        run: npm run verificar -w web
      - name: Testes do núcleo da interface
        run: npm test -w web
      - name: Construir as páginas
        run: npm run build -w web
      - uses: actions/upload-artifact@v4
        with:
          name: interface
          path: web/dist/
          retention-days: 7

  api:
    name: API (TypeScript + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bento
          POSTGRES_USER: bento
          POSTGRES_PASSWORD: bento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bento"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Checar tipos
        run: npm run verificar -w api
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Testes da API com cobertura (PGlite)
        run: npm run cobertura -w api
      - name: Compilar a API
        run: npm run build -w api
      - name: Migrar, semear, fazer backup e restaurar no PostgreSQL
        env:
          DATABASE_URL: postgres://bento:bento@localhost:5432/bento
          BENTO_SEGREDO_JWT: segredo-de-teste-da-integracao-continua-com-mais-de-32-caracteres
        run: |
          node api/dist/cli.js migrar
          node api/dist/cli.js semear
          node api/dist/cli.js backup --pasta /tmp/bento-backups
          node api/dist/cli.js restaurar "$(ls /tmp/bento-backups/*.ndjson.gz | head -n 1)" --sim
          node api/dist/cli.js diagnostico
      - name: Subir contra um PostgreSQL de verdade
        env:
          DATABASE_URL: postgres://bento:bento@localhost:5432/bento
          BENTO_SEGREDO_JWT: segredo-de-teste-da-integracao-continua-com-mais-de-32-caracteres
          BENTO_SIMULADOR: "false"
          BENTO_METRICAS_TOKEN: token-de-metricas-da-integracao-continua
        run: |
          node api/dist/servidor.js &
          for tentativa in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/saude/pronto; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/v1/saude | grep -q '"banco":"postgresql"'
          curl -fsS -H "Authorization: Bearer token-de-metricas-da-integracao-continua" http://localhost:8080/api/v1/metricas | grep -q 'bento_info{'
          curl -fsS -c cookies.txt -H "Content-Type: application/json" -H "X-Bento: 1" \
            -d '{"email":"admin@bento.local","senha":"bento123"}' http://localhost:8080/api/v1/auth/entrar > /dev/null
          curl -fsS -b cookies.txt "http://localhost:8080/api/v1/visao-geral?periodo=30d" | grep -q '"kpis"'
          curl -fsS -b cookies.txt "http://localhost:8080/api/v1/usuarios?porPagina=5" | grep -q '"itens"'
          curl -fsS -b cookies.txt "http://localhost:8080/api/v1/insights" | grep -q '"previsao"'
          curl -fsS -b cookies.txt -H "Content-Type: application/json" -H "X-Bento: 1" \
            -d '{"metrica":"taxa_falha","janela":"24h","modo":"valor","operador":"maior","limite":5}' http://localhost:8080/api/v1/alertas/simular | grep -q '"dispararia"'
          curl -fsS -b cookies.txt "http://localhost:8080/api/v1/configuracoes/seguranca/dois-fatores" | grep -q '"ativo":false'

  docker:
    name: Imagem Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Construir a imagem
        run: docker build -t bento:ci .
